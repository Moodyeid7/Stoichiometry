let inventoryVisible=[false,false,false,false,false];let lang='he',level=0,coeffs=data.map(d=>d.target.map(()=>1)),hintCount=[0,0,0,0,0],qIndex=0,selected=-1,qChecked=false,solved=[false,false,false,false,false],scormStarted=false;const $=id=>document.getElementById(id);function t(){return i18n[lang]}function gcd(a,b){while(b){[a,b]=[b,a%b]}return a}function counts(){const d=data[level],left={},right={};d.atoms.forEach((atoms,i)=>{let dest=d.side[i]===0?left:right;Object.entries(atoms).forEach(([el,n])=>dest[el]=(dest[el]||0)+n*coeffs[level][i])});return {left,right}}function balanced(){let {left,right}=counts();return data[level].elements.every(el=>left[el]===right[el])}function normalized(){return coeffs[level].reduce((a,b)=>gcd(a,b))===1}function equation(){let d=data[level],s='';d.tex.forEach((x,i)=>{if(i>0)s+=d.side[i]!==d.side[i-1]?'\\;\\longrightarrow\\;':'\\;+\\;';s+=(coeffs[level][i]===1?'':coeffs[level][i])+x});return '\\('+s+'\\)'}function typeset(){if(window.MathJax?.typesetPromise){MathJax.typesetPromise([$('equation')]).catch(()=>{})}}function render(){let z=t(),d=data[level];document.documentElement.lang=lang;document.documentElement.dir='rtl';$('title').textContent=z.title;$('subtitle').textContent=z.subtitle;$('lang').textContent=z.lang;$('levels').innerHTML=z.levels.map((n,i)=>`<button class="${level===i?'active':''}" data-level="${i}">${solved[i]?'✓ ':''}${n}</button>`).join('');$('levelTitle').textContent=z.levels[level];$('levelIntro').textContent=z.intros[level];$('equation').textContent=equation();$('coefficientTitle').textContent=z.coeff;$('coeffs').innerHTML=d.names.map((n,i)=>`<div class="coeff"><b>${n}</b><div class="btns"><button data-coeff="${i}" data-change="-1" ${coeffs[level][i]===1?'disabled':''}>−</button><strong>${coeffs[level][i]}</strong><button data-coeff="${i}" data-change="1" ${coeffs[level][i]===12?'disabled':''}>+</button></div></div>`).join('');$('inventoryTitle').textContent=z.inventory;$('inventoryPanel').hidden=!inventoryVisible[level];$('toggleInventory').textContent=inventoryVisible[level]?(lang==='he'?'הסתירו ספירת אטומים':'إخفاء عدّ الذرات'):(lang==='he'?'הצג ספירת אטומים':'اعرض عدّ الذرات');$('elementLabel').textContent=z.element;$('leftLabel').textContent=z.left;$('rightLabel').textContent=z.right;$('statusLabel').textContent=z.status;let c=counts();$('inventory').innerHTML=d.elements.map(el=>{let ok=c.left[el]===c.right[el];return `<tr><th>${el}</th><td>${c.left[el]||0}</td><td>${c.right[el]||0}</td><td class="${ok?'ok':'bad'}">${ok?'✓':'✗'}</td></tr>`}).join('');$('check').textContent=z.check;$('hint').textContent=z.hint;$('solution').textContent=z.solution;$('principle').textContent=z.principle;$('reset').textContent=z.reset;$('completion').textContent=z.finish;$('hints').innerHTML=z.hints[level].slice(0,hintCount[level]).map((v,i)=>`<div class="hint"><b>${i+1}.</b> ${v}</div>`).join('');$('questionArea').style.display=level===0&&qIndex<questions[lang].length?'block':'none';if(level===0&&qIndex<questions[lang].length){let q=questions[lang][qIndex];$('questionProgress').textContent=`${z.qstep} ${qIndex+1}/${questions[lang].length}`;$('questionText').textContent=q.q;$('answers').innerHTML=q.a.map((v,i)=>`<label><input type="radio" name="answer" value="${i}" ${selected===i?'checked':''}>${v}</label>`).join('');$('answerCheck').textContent=z.questionCheck;$('nextQuestion').textContent=z.next;$('nextQuestion').disabled=!(qChecked&&selected===q.right);$('questionFeedback').innerHTML=qChecked?`<div class="feedback ${selected===q.right?'good':''}">${selected===q.right?z.correct+q.ex:z.wrong+z.principle}</div>`:''}typeset()}
function feedback(message,good){$('balanceFeedback').innerHTML=`<div class="feedback ${good?'good':''}">${message}</div>`}function initScorm(){try{let a=findAPI(window);if(a){window.scormAPI=a;a.LMSInitialize('');scormStarted=true;a.LMSSetValue('cmi.core.lesson_status','incomplete');a.LMSCommit('')}}catch(e){}}function findAPI(w){let tries=0;while(w&&tries++<10){try{if(w.API)return w.API;if(w.parent===w)break;w=w.parent}catch(e){break}}return null}function record(){if(solved.every(Boolean)){try{if(scormStarted){scormAPI.LMSSetValue('cmi.core.lesson_status','completed');scormAPI.LMSCommit('')}}catch(e){}}}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.level!==undefined){level=Number(b.dataset.level);$('balanceFeedback').innerHTML='';render()}else if(b.dataset.coeff!==undefined){let i=Number(b.dataset.coeff);coeffs[level][i]=Math.min(12,Math.max(1,coeffs[level][i]+Number(b.dataset.change)));$('balanceFeedback').innerHTML='';render()}});document.addEventListener('change',e=>{if(e.target.name==='answer'){selected=Number(e.target.value);qChecked=false;render()}});$('lang').onclick=()=>{lang=lang==='he'?'ar':'he';render()};$('toggleInventory').onclick=()=>{inventoryVisible[level]=!inventoryVisible[level];render()};$('hint').onclick=()=>{hintCount[level]=Math.min(3,hintCount[level]+1);render()};$('solution').onclick=()=>{if(level===0&&qIndex<questions[lang].length){feedback(lang==='he'?'קודם השלימו את השאלות המנחות.':'أكمل الأسئلة الموجّهة أولًا.',false);return}if(hintCount[level]<2){hintCount[level]=2;render();feedback(lang==='he'?'קודם קראו שני רמזים ונסו בעצמכם.':'اقرأ تلميحين أولًا وحاول بنفسك.',false)}else{coeffs[level]=[...data[level].target];render();feedback(t().done,true)}};$('check').onclick=()=>{if(level===0&&qIndex<questions[lang].length){feedback(lang==='he'?'סיימו תחילה את השאלות המנחות.':'أكمل الأسئلة الموجّهة أولًا.',false);return}if(balanced()&&normalized()){solved[level]=true;feedback(t().done,true);record();$('levels').innerHTML=t().levels.map((n,i)=>`<button class="${level===i?'active':''}" data-level="${i}">${solved[i]?'✓ ':''}${n}</button>`).join('')}else if(balanced()){feedback(t().multiples,false)}else feedback(t().incorrect,false)};$('answerCheck').onclick=()=>{if(selected<0)return;qChecked=true;render()};$('nextQuestion').onclick=()=>{if(!qChecked||selected!==questions[lang][qIndex].right)return;qIndex++;selected=-1;qChecked=false;if(qIndex===3)coeffs[0]=[1,1,2];if(qIndex===4)coeffs[0]=[2,1,2];if(qIndex===questions[lang].length)inventoryVisible[0]=true;render();if(qIndex===questions[lang].length)feedback(t().complete,true)};$('reset').onclick=()=>{coeffs=data.map(d=>d.target.map(()=>1));hintCount=[0,0,0,0,0];inventoryVisible=[false,false,false,false,false];solved=[false,false,false,false,false];level=0;qIndex=0;selected=-1;qChecked=false;$('balanceFeedback').innerHTML='';render();try{if(scormStarted){scormAPI.LMSSetValue('cmi.core.lesson_status','incomplete');scormAPI.LMSCommit('')}}catch(e){}};window.addEventListener('beforeunload',()=>{try{if(scormStarted)scormAPI.LMSFinish('')}catch(e){}});window.addEventListener('load',()=>{render();initScorm()});render();
</script></body></html>
