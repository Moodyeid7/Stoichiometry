<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S1 — Formula Explorer</title><style>
:root{font-family:Arial,'Noto Sans',sans-serif;color:#183149;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1100px;margin:auto;padding:22px}header{background:#153c5a;color:white;border-radius:20px;padding:20px 24px;display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}h1{font-size:1.55rem;margin:4px 0}h2{font-size:1.15rem;margin:0 0 12px}.eyebrow{opacity:.78;font-size:.85rem}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tabs button,.btn{border:1px solid #b7cadd;background:white;border-radius:11px;padding:11px 15px;color:#153c5a;font-size:1rem;cursor:pointer}.tabs button.active{background:#176b91;color:white;border-color:#176b91}.btn.primary{background:#176b91;color:white;border-color:#176b91}.btn:focus-visible,.tabs button:focus-visible{outline:3px solid #efb950}button:disabled{opacity:.4;cursor:not-allowed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:white;border:1px solid #dae5ee;border-radius:18px;padding:20px;box-shadow:0 3px 14px #2445620c}.intro{margin:0 0 16px;line-height:1.65}.formula{direction:ltr;text-align:center;background:#eff6fa;padding:20px;border-radius:14px;font-size:2.1rem;min-height:112px;display:flex;align-items:center;justify-content:center}.formula mjx-container{margin:0!important}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.control{background:#f5f8fb;border-radius:12px;padding:12px 7px;text-align:center}.control .buttons{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;direction:ltr}.control button{width:36px;height:36px;border-radius:10px;border:1px solid #aac1d2;background:white;font-size:1.25rem;cursor:pointer}.control strong{min-width:16px}.preset{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.preset button{border:1px solid #b8cbd8;border-radius:9px;background:#f3f9fc;padding:9px 12px;cursor:pointer;direction:ltr}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}.stat{background:#f0f7fa;border-radius:12px;text-align:center;padding:12px}.stat b{display:block;font-size:1.6rem}.viz{min-height:190px;border:1px dashed #bed2df;border-radius:13px;padding:12px;display:flex;gap:14px;flex-wrap:wrap;align-content:center;justify-content:center;direction:ltr}.unit{display:flex;align-items:center;gap:4px;padding:10px;border-radius:15px;background:#f2f7fb;flex-wrap:wrap;max-width:100%}.atom{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-size:10px;font-weight:bold;border:1px solid #8a9caa}.atom.h{background:#e6eef6;color:#294866}.atom.o{background:#ed7772;color:white;border-color:#c4514c}.atom.ca{background:#86b5dd;color:#123c5b}.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:.9rem}.notice{font-size:.87rem;color:#5b7286;line-height:1.6;margin-top:12px}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}.lang{background:#fff;color:#173e59;border:0;border-radius:10px;padding:11px 16px;font-weight:bold;cursor:pointer}.concept{border-inline-start:4px solid #36a79b;background:#f0faf7;padding:12px 14px;border-radius:8px;line-height:1.7;margin-top:16px}small{color:#60798d}@media(max-width:760px){.grid{grid-template-columns:1fr}.shell{padding:12px}.controls{gap:6px}.control{padding:10px 2px}.control .buttons{gap:6px}.control button{width:30px;height:32px}}
</style><script>window.MathJax={tex:{inlineMath:[['\\(','\\)']]},svg:{fontCache:'local'},startup:{typeset:false}};</script><script defer src="mathjax/tex-svg.js"></script></head><body><main class="shell"><header><div><div class="eyebrow">General Chemistry 2545 · Oranim · SCORM S1</div><h1 id="title"></h1><div id="subtitle"></div></div><button class="lang" id="langBtn" type="button"></button></header><nav class="tabs" id="tabs" aria-label="Stations"></nav><div class="grid"><section class="panel"><h2 id="stationTitle"></h2><p class="intro" id="intro"></p><div class="formula" id="formula" aria-live="polite"></div><div class="controls" id="controls"></div><div><strong id="presetLabel"></strong><div class="preset" id="presets"></div></div><div class="concept" id="concept"></div></section><section class="panel"><h2 id="visualTitle"></h2><div class="stats" id="stats"></div><div class="viz" id="viz" aria-label="Atom inventory"></div><div class="legend" id="legend"></div><p class="notice" id="note"></p><div class="footer"><small id="status"></small><button class="btn" id="reset"></button></div></section></div></main><script>
const i18n={he:{title:'חוקרים מקדמים ואינדקסים',subtitle:'משנים מספרים, מתבוננים באטומים ומגלים את המשמעות',tabs:['מים ומי חמצן','מקדמים וכמות אטומים','סוגריים בנוסחה'],intro:['מה קורה כשמשנים את האינדקס של החמצן? ומה קורה כשמשנים את המקדם?','שנו את המקדם ואת האינדקסים. עקבו אחר מספר יחידות הנוסחה ומספר האטומים הכולל.','גלו כיצד האינדקס מחוץ לסוגריים מכפיל את כל האטומים שבתוכם.'],control:['מקדם','אינדקס H','אינדקס O','אינדקס הקבוצה (OH)'],presets:'דוגמאות מוכנות',concept:['מקדם משנה את מספר יחידות הנוסחה. שינוי אינדקס משנה את ההרכב של כל יחידה. H₂O ו־H₂O₂ הם חומרים שונים.','מספר האטומים הכולל של כל יסוד הוא מספר היחידות כפול מספר האטומים מאותו יסוד ביחידה אחת.','ב־Ca(OH)₂ יש אטום Ca אחד, שני אטומי O ושני אטומי H. המקדם מכפיל את כל היחידה.'],visual:'מודל חלקיקים וספירת אטומים',units:'יחידות נוסחה',hydrogen:'אטומי מימן',oxygen:'אטומי חמצן',calcium:'אטומי סידן',note:'התרשים מציג מלאי אטומים בלבד ולא גאומטריה מולקולרית. שינוי אינדקסים עשוי ליצור נוסחאות היפותטיות שאינן מייצגות חומרים יציבים.',reset:'איפוס הפעילות',language:'العربية',status:'פעילות חקר ללא ציון · אפשר לחזור ולנסות ללא הגבלה',group:'קבוצות OH ליחידה'},ar:{title:'استكشاف المعاملات والأرقام السفلية',subtitle:'غيّر الأرقام، راقب الذرات واكتشف معناها',tabs:['الماء وفوق أكسيد الهيدروجين','المعاملات وعدد الذرات','الأقواس في الصيغ'],intro:['ماذا يحدث عندما نغيّر الرقم السفلي للأكسجين؟ وماذا يحدث عندما نغيّر المعامل؟','غيّر المعامل والأرقام السفلية، وراقب عدد وحدات الصيغة والعدد الكلي للذرات.','اكتشف كيف يضاعف الرقم خارج القوس جميع الذرات الموجودة داخله.'],control:['المعامل','الرقم السفلي H','الرقم السفلي O','الرقم خارج (OH)'],presets:'أمثلة جاهزة',concept:['المعامل يغيّر عدد وحدات الصيغة. تغيير الرقم السفلي يغيّر تركيب كل وحدة. H₂O وH₂O₂ مادتان مختلفتان.','العدد الكلي لذرات العنصر يساوي عدد الوحدات مضروبًا في عدد ذرات العنصر في الوحدة الواحدة.','في Ca(OH)₂ توجد ذرة Ca واحدة وذرتان من O وذرتان من H. المعامل يضاعف الوحدة كلها.'],visual:'نموذج الجسيمات وعدّ الذرات',units:'وحدات الصيغة',hydrogen:'ذرات الهيدروجين',oxygen:'ذرات الأكسجين',calcium:'ذرات الكالسيوم',note:'الرسم يوضح عدد الذرات فقط، وليس الشكل الهندسي للجزيء. قد تؤدي تغييرات الأرقام السفلية إلى صيغ افتراضية لا تمثل مواد مستقرة.',reset:'إعادة ضبط النشاط',language:'עברית',status:'نشاط استكشافي دون علامة · يمكن تكراره دون حدود',group:'مجموعات OH في الوحدة'}};
let lang='he',station=0,vals={c:2,h:2,o:1,g:2};const $=id=>document.getElementById(id);function latex(){return station===2?`${vals.c}\\mathrm{Ca}(\\mathrm{OH})_{${vals.g}}`:`${vals.c}\\mathrm{H}_{${vals.h}}\\mathrm{O}_{${vals.o}}`};function atom(el){return `<span class="atom ${el.toLowerCase()}">${el}</span>`}function count(){return station===2?{Ca:vals.c,O:vals.c*vals.g,H:vals.c*vals.g}:{H:vals.c*vals.h,O:vals.c*vals.o}}function update(){const t=i18n[lang];document.documentElement.lang=lang;document.documentElement.dir='rtl';$('title').textContent=t.title;$('subtitle').textContent=t.subtitle;$('langBtn').textContent=t.language;$('tabs').innerHTML=t.tabs.map((v,i)=>`<button type="button" data-tab="${i}" class="${i===station?'active':''}" aria-current="${i===station?'page':'false'}">${i+1}. ${v}</button>`).join('');$('stationTitle').textContent=t.tabs[station];$('intro').textContent=t.intro[station];$('formula').innerHTML=`\\(${latex()}\\)`;const controls=station===2?[['c',t.control[0]],['g',t.control[3]]]:[['c',t.control[0]],['h',t.control[1]],['o',t.control[2]]];$('controls').style.gridTemplateColumns=`repeat(${controls.length},minmax(0,1fr))`;$('controls').innerHTML=controls.map(([k,label])=>`<div class="control"><div>${label}</div><div class="buttons"><button type="button" data-key="${k}" data-delta="-1" aria-label="${label} -" ${vals[k]===1?'disabled':''}>−</button><strong>${vals[k]}</strong><button type="button" data-key="${k}" data-delta="1" aria-label="${label} +" ${vals[k]===4?'disabled':''}>+</button></div></div>`).join('');$('presetLabel').textContent=t.presets;let ps=station===2?[{label:'Ca(OH)₂',v:{c:1,g:2}},{label:'3Ca(OH)₂',v:{c:3,g:2}},{label:'Ca(OH)₃',v:{c:1,g:3}}]:[{label:'H₂O',v:{c:1,h:2,o:1}},{label:'H₂O₂',v:{c:1,h:2,o:2}},{label:'2H₂O',v:{c:2,h:2,o:1}},{label:'3H₂O',v:{c:3,h:2,o:1}}];$('presets').innerHTML=ps.map((p,i)=>`<button type="button" data-preset="${i}">${p.label}</button>`).join('');$('concept').textContent=t.concept[station];$('visualTitle').textContent=t.visual;let counts=count();$('stats').innerHTML=`<div class="stat"><b>${vals.c}</b>${t.units}</div>`+Object.entries(counts).map(([e,n])=>`<div class="stat"><b>${n}</b>${e==='H'?t.hydrogen:e==='O'?t.oxygen:t.calcium}</div>`).join('');let unit=station===2?atom('Ca')+Array.from({length:vals.g},()=>atom('O')+atom('H')).join(''):Array.from({length:vals.h},()=>atom('H')).join('')+Array.from({length:vals.o},()=>atom('O')).join('');$('viz').innerHTML=Array.from({length:vals.c},()=>`<div class="unit">${unit}</div>`).join('');$('legend').innerHTML=(station===2?['Ca','O','H']:['O','H']).map(e=>`${atom(e)} ${e}`).join(' ');$('note').textContent=t.note;$('status').textContent=t.status;$('reset').textContent=t.reset; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([$('formula')]).catch(()=>{});}
function mark(){try{if(window.API){API.LMSInitialize('');API.LMSSetValue('cmi.core.lesson_status','completed');API.LMSCommit('')}}catch(e){}}function defaults(){vals={c:2,h:2,o:1,g:2}}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab!==undefined){station=Number(b.dataset.tab);defaults();update();mark()}else if(b.dataset.key){const k=b.dataset.key;vals[k]=Math.max(1,Math.min(4,vals[k]+Number(b.dataset.delta)));update();mark()}else if(b.dataset.preset!==undefined){let ps=station===2?[{c:1,g:2},{c:3,g:2},{c:1,g:3}]:[{c:1,h:2,o:1},{c:1,h:2,o:2},{c:2,h:2,o:1},{c:3,h:2,o:1}];Object.assign(vals,ps[Number(b.dataset.preset)]);update();mark()}});$('langBtn').addEventListener('click',()=>{lang=lang==='he'?'ar':'he';update()});$('reset').addEventListener('click',()=>{station=0;defaults();update()});window.addEventListener('load',()=>{update();mark()});window.addEventListener('beforeunload',()=>{try{if(window.API)API.LMSFinish('')}catch(e){}});update();
</script></body></html>
