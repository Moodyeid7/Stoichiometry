function getAPI(){try{let w=window;for(let i=0;i<8&&w;i++,w=w.parent){if(w.API)return w.API;if(w===w.parent)break}w=window.opener;for(let i=0;i<8&&w;i++,w=w.parent){if(w.API)return w.API;if(w===w.parent)break}}catch(e){}return null}
function scormStart(){API=getAPI();if(!API)return;try{API.LMSInitialize('');const saved=API.LMSGetValue('cmi.suspend_data');if(saved){let prior=JSON.parse(saved);if(prior&&typeof prior.phase==='number'&&prior.phase>=0&&prior.phase<=4&&['he','ar'].includes(prior.lang)){S={...initial,...prior,hints:prior.hints||{},completedCases:prior.completedCases||[]}}}API.LMSSetValue('cmi.core.lesson_status',S.completed?'completed':'incomplete');API.LMSSetValue('cmi.core.exit','suspend');API.LMSCommit('')}catch(e){}}
function persist(){if(!API)return;try{API.LMSSetValue('cmi.suspend_data',JSON.stringify(S));API.LMSSetValue('cmi.core.lesson_status',S.completed?'completed':'incomplete');API.LMSSetValue('cmi.core.exit','suspend');API.LMSCommit('')}catch(e){}}
function quit(){if(!API||finished)return;finished=true;try{persist();API.LMSFinish('')}catch(e){}}
window.addEventListener('pagehide',quit);window.addEventListener('beforeunload',quit);
const t=()=>T[S.lang],p=()=>presets[S.preset],correctVolume=()=>p().target*p().final/p().stock,waterRequired=()=>p().final-correctVolume(),num=v=>Number(v).toLocaleString(S.lang==='he'?'he-IL':'ar-EG',{maximumFractionDigits:3,useGrouping:false}),en=v=>Number(v).toFixed(2).replace(/\.00$/,'');
function math(tex){return `<div class="math" dir="ltr">\\[${tex}\\]</div>`}
function mathInline(tex){return `<span class="ltr">\\(${tex}\\)</span>`}
function btn(id,label,alt=false,disabled=false){return `<button type="button" class="btn ${alt?'alt':''}" id="${id}" ${disabled?'disabled':''}>${label}</button>`}
function bind(id,func){let el=document.getElementById(id);if(el)el.addEventListener('click',func)}
function set(o){Object.assign(S,o);persist();render()}
function hintText(key,items){const h=S.hints[key]||0;return `<div class="actions">${btn('hint',t().hint,true)}${h?`<div class="hint" role="status">${items[Math.min(h-1,items.length-1)]}</div>`:''}</div>`}
function hintBind(key,items){bind('hint',()=>{S.hints[key]=Math.min((S.hints[key]||0)+1,items.length);persist();render()})}
function stages(){document.getElementById('stages').innerHTML=t().stages.map((x,i)=>`<span class="stage ${i===S.phase?'now':i<S.phase?'done':''}">${i+1}. ${x}</span>`).join('')}
function intro(){const correct=S.pred===1;return `<h2>${t().intro}</h2><p>${t().introText}</p>${math(String.raw`n_{\text{before}}=n_{\text{after}}\quad\text{(when only solvent is added)}`)}<p class="muted small">${t().introEq}</p>${t().introOptions.map((o,i)=>`<button class="choice ${S.pred===i?'selected':''}" id="pred${i}">${o}</button>`).join('')}${S.predChecked?`<div class="info ${correct?'good':'warn'}">${correct?t().introYes:t().introNo}</div>`:''}${hintText('intro',t().introHint)}<div class="actions">${btn('check',t().check,false,S.pred===null)}${correct&&S.predChecked?btn('next',t().next):''}</div>`}
function plan(){let c=p();const isGood=S.planChecked&&Math.abs(Number(S.plan)-correctVolume())<=.5;return `<h2>${t().planTitle}</h2><label for="preset">${t().choose}</label><select id="preset">${presets.map((a,i)=>`<option value="${i}" ${i===S.preset?'selected':''}>${t().caseNames[i]}</option>`).join('')}</select><h3>${t().given}</h3><div class="grid three"><div class="data">${t().stock}<strong dir="ltr">${en(c.stock)} M</strong></div><div class="data">${t().target}<strong dir="ltr">${en(c.target)} M</strong></div><div class="data">${t().finalVolume}<strong dir="ltr">${c.final} mL</strong></div></div><h3>${t().mathIntro}</h3>${math(String.raw`n=C\,V\qquad\Longrightarrow\qquad C_1V_1=C_2V_2`)}<p class="small muted">${t().unitFormula}</p><div class="divider"></div><h3>${t().planQuestion}</h3><p>${t().planPrompt}</p><div class="tools"><input id="planInput" type="number" min="0" max="${c.final}" step="0.1" inputmode="decimal" dir="ltr" value="${String(S.plan).replace(/"/g,'')}" aria-label="${t().planQuestion}"><span class="readout" dir="ltr">mL</span></div>${S.planChecked?`<div class="info ${isGood?'good':'warn'}">${isGood?t().planGood:t().planWrong}</div>`:''}${hintText('plan',t().planHint)}<div class="actions">${btn('planCheck',t().planCheck,false,S.plan==='')}${isGood?btn('next',t().lab):''}</div>`}
function particles(n,spanW,upper,bottom){const arr=[];for(let i=0;i<n;i++){const x=65+((i*53+13)%spanW),y=upper+((i*37+9)%Math.max(12,bottom-upper));arr.push(`<circle cx="${x}" cy="${y}" r="3.8" fill="#135ea0" opacity=".88"/>`)}return arr.join('')}
function beaker(amount,total,stockM,word){const fill=total<=0?0:Math.min(1,total/p().final),fillY=238-fill*185;const mole=stockM*amount/1000;const concentration=total?mole/(total/1000):0;const dotCount=amount?Math.min(35,Math.max(3,Math.round(mole*90))):0;const dots=particles(dotCount,120,Math.max(55,fillY+7),232);return `<div class="flask"><strong>${word}</strong><svg viewBox="0 0 250 267" role="img" aria-label="${word}: ${num(total)} mL"><defs><clipPath id="clipB"><path d="M56 31 L56 232 Q56 240 65 240 H185 Q194 240 194 232 V31"/></clipPath></defs><path d="M56 31 L56 232 Q56 240 65 240 H185 Q194 240 194 232 V31" fill="white" stroke="#436d82" stroke-width="4"/><g clip-path="url(#clipB)"><rect x="55" y="${fillY}" width="141" height="${Math.max(0,240-fillY)}" fill="#9ed8f4" opacity=".75"/>${dots}</g><path d="M44 31H206" stroke="#436d82" stroke-width="4" stroke-linecap="round"/><g font-size="12" fill="#547e96"><text x="209" y="${fillY+4}">${num(total)} mL</text></g></svg><div class="legend">${t().mol}: <b dir="ltr">${num(mole)} mol</b></div><div class="legend">${t().conc}: <b dir="ltr">${total?num(concentration):'—'} M</b></div></div>`}
function lab(){let c=p(),aliquot=Number(S.aliquot),water=Number(S.water),volume=aliquot+water,moles=c.stock*aliquot/1000,conc=volume?c.stock*aliquot/volume:0,correct=Math.abs(volume-c.final)<=.6&&Math.abs(conc-c.target)<=.006;let checkText=S.measured?(correct?t().measureGood:t().measureWrong):'';return `<h2>${t().labTitle}</h2><p>${t().labInstructions}</p><div class="info"><strong>${t().labWhat}</strong> ${t().labHow}</div><div class="grid three"><div class="data">${t().stock}<strong dir="ltr">${en(c.stock)} M</strong></div><div class="data">${t().target}<strong dir="ltr">${en(c.target)} M</strong></div><div class="data">${t().finalVolume}<strong dir="ltr">${c.final} mL</strong></div></div><div class="divider"></div><div class="labcontrol"><label for="aliquot">${t().transfer} <span class="ltr">${num(aliquot)} mL</span></label><input id="aliquot" type="range" min="0" max="${c.final}" step="1" value="${aliquot}"></div><div class="labcontrol"><label for="water">${t().water} <span class="ltr">${num(water)} mL</span></label><input id="water" type="range" min="0" max="${c.final}" step="1" value="${water}"></div><div class="visualbox"><div class="data">${t().solution}<strong dir="ltr">${num(volume)} mL</strong><p class="small muted">${t().same}</p>${math(String.raw`n=C_1V_1`)}<p class="small muted">${t().mol}: <span class="ltr">${num(moles)} mol</span></p></div>${beaker(aliquot,volume,c.stock,t().prepared)}</div>${hintText('lab',t().labHint)}<div class="actions">${btn('measure',t().measure)}${S.measured&&correct?btn('next',t().nextStage):''}</div>${S.measured?`<div class="info ${correct?'good':'warn'}" role="status">${checkText} ${t().readout}: <span class="ltr">${num(conc)} M · ${num(volume)} mL</span></div>`:''}<p class="small muted">${t().help}</p>`}
function reflect(){const questions=[['reflect1','reflect1Options',0],['reflect2','reflect2Options',1],['reflect3','reflect3Options',0]];let q=questions[S.refStep],correct=S.refAnswer===q[2];return `<h2>${t().reflect}</h2><div class="pill">${S.refStep+1} / 3</div><h3>${t()[q[0]]}</h3>${t()[q[1]].map((x,i)=>`<button class="choice ${S.refAnswer===i?'selected':''}" id="ref${i}">${x}</button>`).join('')}${S.refChecked?`<div class="info ${correct?'good':'warn'}">${correct?t().reflectGood:t().reflectWrong}</div>`:''}<div class="actions">${btn('check',t().check,false,S.refAnswer===null)}${correct&&S.refChecked?btn('next',S.refStep===2?t().finish:t().next):''}</div>`}
function finish(){let c=p();return `<div class="summary"><h2>✓ ${t().completed}</h2><p>${t().completedText}</p><p>${t().noGrade}</p></div><h3>${t().review}</h3><div class="grid three"><div class="data">${t().transfer}<strong dir="ltr">${en(correctVolume())} mL</strong></div><div class="data">${t().waterAdded}<strong dir="ltr">${en(waterRequired())} mL</strong></div><div class="data">${t().finalVolume}<strong dir="ltr">${c.final} mL</strong></div></div>${math(String.raw`C_1V_1=C_2V_2`)}<p>${t().different}</p><div class="actions">${btn('another',t().another)}${btn('reset2',t().reset,true)}</div>`}
function render(){renderCount++;document.documentElement.lang=S.lang;document.documentElement.dir='rtl';document.getElementById('title').textContent=t().title;document.getElementById('subtitle').textContent=t().subtitle;document.getElementById('lang').textContent=t().lang;document.getElementById('reset').textContent=t().reset;document.getElementById('foot').textContent=t().foot;stages();document.getElementById('root').innerHTML=[intro,plan,lab,reflect,finish][S.phase]();
if(S.phase===0){for(let i=0;i<3;i++)bind('pred'+i,()=>set({pred:i,predChecked:false}));bind('check',()=>set({predChecked:true}));bind('next',()=>set({phase:1}));hintBind('intro',t().introHint)}
if(S.phase===1){const select=document.getElementById('preset');select.onchange=e=>{const k=Number(e.target.value);S.preset=k;S.plan='';S.planChecked=false;S.aliquot=0;S.water=0;S.measured=false;S.hints={};persist();render()};document.getElementById('planInput').oninput=e=>{S.plan=e.target.value;S.planChecked=false;persist();document.getElementById('planCheck').disabled=!S.plan};bind('planCheck',()=>{S.plan=document.getElementById('planInput').value;set({planChecked:true})});bind('next',()=>set({phase:2,aliquot:Number(S.plan),water:0,measured:false}));hintBind('plan',t().planHint)}
if(S.phase===2){for(const field of ['aliquot','water']){document.getElementById(field).onchange=e=>{S[field]=Number(e.target.value);S.measured=false;persist();render()}}bind('measure',()=>set({measured:true}));bind('next',()=>set({phase:3,refStep:0,refAnswer:null,refChecked:false}));hintBind('lab',t().labHint)}
if(S.phase===3){for(let i=0;i<3;i++)bind('ref'+i,()=>set({refAnswer:i,refChecked:false}));bind('check',()=>set({refChecked:true}));bind('next',()=>{if(S.refStep<2)set({refStep:S.refStep+1,refAnswer:null,refChecked:false});else{let cs=Array.from(new Set([...S.completedCases,S.preset]));set({phase:4,completed:true,completedCases:cs})}})}
if(S.phase===4){bind('another',()=>set({phase:1,preset:(S.preset+1)%3,plan:'',planChecked:false,aliquot:0,water:0,measured:false,hints:{},refStep:0,refAnswer:null,refChecked:false}));bind('reset2',reset)}
const rc=renderCount;const typeset=()=>{if(rc!==renderCount)return;if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise([document.getElementById('root')]).catch(e=>{console.error('MathJax',e)})}};if(window.MathJax&&window.MathJax.startup&&window.MathJax.startup.promise)window.MathJax.startup.promise.then(typeset);else typeset()}
function reset(){if(!window.confirm(t().resetConfirm))return;let lang=S.lang;S={...initial,lang,hints:{},completedCases:[]};persist();render()}
document.getElementById('lang').addEventListener('click',()=>set({lang:S.lang==='he'?'ar':'he'}));document.getElementById('reset').addEventListener('click',reset);scormStart();if(window.MathJax && window.MathJax.startup && window.MathJax.startup.promise){window.MathJax.startup.promise.then(render).catch(()=>render())}else{render();}
})();
</script></body></html>
