function render(){document.documentElement.lang=state.lang;document.documentElement.dir='rtl';$('title').textContent=t('title');$('subtitle').textContent=t('subtitle');$('language').textContent=t('switch');$('restart').textContent=t('restart');$('foot').textContent=t('tracking');$('language').onclick=()=>{state.lang=state.lang==='he'?'ar':'he';store();render()};$('restart').onclick=()=>{if(confirm(state.lang==='he'?'למחוק את כל ההתקדמות ולהתחיל מחדש?':'هل تريدون حذف كل التقدّم والبدء مجددًا؟')){let lang=state.lang;state={lang,task:0,stage:0,selection:'',path:[],factors:[],factorChoice:'',value:'',hint:0,message:'',success:false,complete:[false,false,false,false]};store();render()}};const nav=$('levels');nav.replaceChildren();tasks.forEach((d,i)=>{const label=(state.lang==='he'?['יחס מולים','מסה ← מולים','מסה ← מסה','תרגול חדש']:['نسبة مولات','كتلة ← مولات','كتلة ← كتلة','تطبيق جديد'])[i];add(nav,btn(`${i+1}. ${label}${state.complete[i]?' ✓':''}`,()=>resetTask(i),i===state.task?'active':''))});const app=$('app');app.replaceChildren();const d=task();add(app,make('span','tag',`${t('step')} ${state.stage+1} ${t('of')} 4`));add(app,make('h2','',`${t('problem')} ${state.task+1}`));add(app,make('p','',d[state.lang]));add(app,make('div','muted',t('equation')));add(app,make('div','eq',tex(d.eq)));const g=make('div','grid');add(g,make('div','fact',`${t('given')}: <strong dir="ltr">${fmt(d.num)} ${raw(d.start)}</strong>`));add(g,make('div','fact',`${t('wanted')}: <strong>${raw(d.goal)}</strong>`));add(app,g);
if(state.stage===0){add(app,make('h3','',t('ask')));renderIdentify(app,d)}else if(state.stage===1){renderPath(app,d)}else if(state.stage===2){renderFactors(app,d)}else{renderCompute(app,d)}
const controls=make('div','buttons');if(state.stage>0)add(controls,btn('↩ '+t('back'),()=>{state.stage--;state.message='';state.hint=0;state.success=false;store();render()}));add(controls,btn((state.hint? t('anotherHint'):t('hint'))+' 💡',()=>{state.hint=Math.min(3,state.hint+1);store();render()}));add(app,controls);if(state.hint)add(app,make('div','help',hintText()));typeset();}
function renderIdentify(app,d){const s=make('div','step');add(s,make('p','',t('chooseGiven')));const opts=make('div','buttons');['g','n'].forEach(u=>add(opts,btn(u==='g'?(state.lang==='he'?'גרם (מסה)':'غرام (كتلة)'):(state.lang==='he'?'מול (כמות חומר)':'مول (كمية مادة)'),()=>{state.selection=u;state.message='';store();render()},state.selection.split('|')[0]===u?'selected':'')));add(s,opts);add(s,make('p','',t('chooseTarget')));const target=make('div','buttons');['g','n'].forEach(u=>add(target,btn(u==='g'?'g':'mol',()=>{state.selection=state.selection.split('|')[0]+'|'+u;state.message='';store();render()},state.selection.endsWith('|'+u)?'selected':'')));add(s,target);add(s,btn(t('check'),()=>{if(state.selection===d.start[0]+'|'+d.goal[0]){state.stage=1;state.message='';state.hint=0;state.success=false}else state.message=t('incorrect');store();render()},'primary'));msg(s,state.message);add(app,s)}
function renderPath(app,d){add(app,make('h3','',t('pathQuestion')));add(app,make('p','muted',t('pathExplain')));const p=make('div','path');add(p,make('span','chip',raw(d.start)));state.path.forEach(a=>{add(p,make('span','arrow','→'));add(p,make('span','chip',raw(a)))});add(p,make('span','arrow','→'));add(p,make('span','chip',raw(d.goal)));add(app,p);add(app,make('p','',t('add')));const opts=make('div','buttons');const targets=[['n',d.start[1]],['n',d.goal[1]],['g',d.start[1]],['g',d.goal[1]]].filter((x,i,a)=>!same(x,d.start)&&!same(x,d.goal)&&a.findIndex(y=>same(x,y))===i);targets.forEach(o=>add(opts,btn(raw(o),()=>{state.path.push(o);state.message='';store();render()},'',state.path.some(x=>same(x,o)))));add(app,opts);const controls=make('div','buttons');add(controls,btn('↶ '+t('undo'),()=>{state.path.pop();state.message='';store();render()},'',!state.path.length));add(controls,btn(t('ready'),()=>{if(same(state.path,needed(d))){state.stage=2;state.message='';state.hint=0;state.success=false}else state.message=t('pathWrong');store();render()},'primary'));add(app,controls);msg(app,state.message)}
function renderFactors(app,d){
 const fs=factors(d),steps=chain(d),i=state.factors.length,he=state.lang==='he';
 add(app,make('h3','',he?'איך מבצעים את המעבר הבא?':'كيف ننفّذ الانتقال التالي؟'));
 const chainBox=make('div','path');steps.forEach((x,j)=>{if(j)add(chainBox,make('span','arrow','→'));add(chainBox,make('span','chip',raw(x)))});add(app,chainBox);
 const done=make('div','mathgrid');state.factors.forEach((f,j)=>{const prev=steps[j],nxt=steps[j+1],m=prev[1]===nxt[1];add(done,make('div','mathrow',m?(prev[0]==='g'?`\\(n = m/M\\)`:`\\(m=n\\cdot M\\)`):tex(f.label)))});add(app,done);
 if(i>=fs.length){add(app,make('div','good',he?'סיימתם את שלבי ההמרה. כעת חשבו את התשובה.':'أنهيتم خطوات التحويل. الآن احسبوا النتيجة.'));add(app,btn(t('continue'),()=>{state.stage=3;state.message='';state.hint=0;state.success=false;store();render()},'primary'));return}

 if(isMass){

 add(app,make('div','mathrow',tex(`M(${latex[curr[1]]})=${fmt(m)}\\,\\mathrm{g/mol}`)));
 const opts=make('div','answers');const choices=toMol?[
 {key:'divide',label:he?'לחלק את המסה במסה המולרית: n = m / M':'قسمة الكتلة على الكتلة المولية: n = m / M'},
 {key:'multiply',label:he?'לכפול את המסה במסה המולרית: n = m · M':'ضرب الكتلة في الكتلة المولية: n = m · M'}]:[
 {key:'multiply',label:he?'לכפול את מספר המולים במסה המולרית: m = n · M':'ضرب عدد المولات في الكتلة المولية: m = n · M'},
 {key:'divide',label:he?'לחלק את מספר המולים במסה המולרית: m = n / M':'قسمة عدد المولات على الكتلة المولية: m = n / M'}];
 choices.forEach(c=>add(opts,btn(c.label,()=>{state.factorChoice=c.key;state.message='';state.success=false;store();render()},state.factorChoice===c.key?'selected':'')));add(app,opts);
 const answer=toMol?'divide':'multiply';
 add(app,btn(t('check'),()=>{if(state.factorChoice===answer){state.factors.push(f);state.factorChoice='';state.message=he?(toMol?'נכון. מחלקים גרמים ב־g/mol וכך מקבלים mol.':'נכון. מכפילים mol ב־g/mol וכך מקבלים גרמים.'):(toMol?'صحيح. نقسم g على g/mol فنحصل على mol.':'صحيح. نضرب mol في g/mol فنحصل على غرام.');state.success=true}else{state.message=he?'בדקו שוב: איזו פעולה נותנת את היחידה הרצויה?':'فكروا: أي عملية تعطي الوحدة المطلوبة؟';state.success=false}store();render()},'primary',!state.factorChoice));
 }else{
 add(app,make('p','',he?'כדי לעבור בין חומרים משתמשים במקדמים של המשוואה המאוזנת. איזה יחס נותן מולים של החומר המבוקש?':'للتحويل بين مادتين نستخدم معاملات المعادلة الموزونة. أي نسبة تعطينا مولات المادة المطلوبة؟'));
 const choices=make('div','answers');[f.label,f.bad].forEach(x=>{const b=btn('',()=>{state.factorChoice=x;state.message='';state.success=false;store();render()},state.factorChoice===x?'selected':'');b.innerHTML=tex(x);add(choices,b)});add(app,choices);
 add(app,btn(t('check'),()=>{if(state.factorChoice===f.label){state.factors.push(f);state.factorChoice='';state.message=he?'נכון: מכפילים במקדם של החומר המבוקש ומחלקים במקדם של החומר הנתון.':'صحيح: نضرب بمعامل المادة المطلوبة ونقسم على معامل المادة المعطاة.';state.success=true}else{state.message=he?'היחס הפוך: האם המונה מייצג את החומר שאליו רוצים להגיע?':'النسبة مقلوبة: هل البسط يمثل المادة التي نريد الوصول إليها؟';state.success=false}store();render()},'primary',!state.factorChoice));
 }
 msg(app,state.message,state.success);

function renderCompute(app,d){
 const he=state.lang==='he',steps=chain(d),fs=factors(d);add(app,make('h3','',t('compute')));
 add(app,make('p','muted',he?'חישוב בשלבים בעזרת הנוסחאות שלמדתם:':'حساب تدريجي باستعمال المعادلات التي تعلمتموها:'));
 const pane=make('div','mathgrid');let current=d.num;
 fs.forEach((f,i)=>{
   const a=steps[i],b=steps[i+1],isMass=a[1]===b[1],M=d.masses[a[1]];let label='';
   if(isMass){if(a[0]==='g'){label=`n = ${fmt(current)} \\div ${fmt(M)} = ${fmt(current/M)}\\,\\mathrm{mol}`;current/=M}else{label=`m = ${fmt(current)} \\times ${fmt(M)} = ${fmt(current*M)}\\,\\mathrm{g}`;current*=M}}

 });add(app,pane);

}
const scorm={api:null,find(w){for(let depth=0;w&&depth<10;depth++){try{if(w.API)return w.API;if(w===w.parent)break;w=w.parent}catch(e){break}}try{return window.opener&&window.opener.API}catch(e){return null}},init(){this.api=this.find(window);if(this.api){try{this.api.LMSInitialize('');const current=this.api.LMSGetValue('cmi.core.lesson_status');if(!current||current==='not attempted')this.set('cmi.core.lesson_status','incomplete');this.commit()}catch(e){}}},set(k,v){if(this.api)this.api.LMSSetValue(k,v)},commit(){if(this.api)this.api.LMSCommit('')},finish(){if(this.api){this.commit();this.api.LMSFinish('')}}};window.scorm=scorm;scorm.init();window.addEventListener('pagehide',()=>scorm.finish());try{const previous=JSON.parse(localStorage.getItem('s3_stoich_state')||'null');const resume=(()=>{try{return scorm.api&&JSON.parse(scorm.api.LMSGetValue('cmi.suspend_data')||'null')}catch(e){return null}})()||previous;if(resume&&resume.complete?.length===4){state={...state,...resume,stage:Math.max(0,Math.min(3,resume.stage||0)),task:Math.max(0,Math.min(3,resume.task||0))};if(state.stage===2){state.factors=[];state.factorChoice='';}}}catch(e){};render();
