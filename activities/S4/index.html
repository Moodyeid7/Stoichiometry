function renderScene(root){text(root,tr('choose'),'h2');const picks=html('div','toolbar');Object.keys(scenes).forEach(key=>btn(picks,tr(key),()=>{st.scene=key;st.revealed=false;rerender()},st.scene===key?'active':''));add(root,picks);const s=scenes[st.scene],[a,b]=st.supply[st.scene];text(root,tr('recipe'),'h3');const rec=html('div','panel');text(rec,`${s.ra} × ${tr(s.a)} + ${s.rb} × ${tr(s.b)} → 1 × ${tr(s.p)}`);add(root,rec);text(root,tr('have'),'h3');const g=html('div','grid');control(g,`${s.ea} ${tr(s.a)}`,a,n=>{st.supply[st.scene][0]=n;st.revealed=false;rerender()});control(g,`${s.eb} ${tr(s.b)}`,b,n=>{st.supply[st.scene][1]=n;st.revealed=false;rerender()});add(root,g);text(root,tr('think'),'p','summary');const acts=html('div','actions');btn(acts,st.revealed?tr('hide'):tr('reveal'),()=>{st.revealed=!st.revealed;progress();rerender()},'primary');add(root,acts);if(st.revealed){const n=Math.min(Math.floor(a/s.ra),Math.floor(b/s.rb)),la=a-s.ra*n,lb=b-s.rb*n,lim=Math.floor(a/s.ra)===Math.floor(b/s.rb)?'equal':Math.floor(a/s.ra)<Math.floor(b/s.rb)?s.a:s.b;const d=html('section','panel');text(d,tr('how'),'h3');text(d,`${tr(s.a)}: ${a} ÷ ${s.ra} = ${fmt(a/s.ra)}; ${tr(s.b)}: ${b} ÷ ${s.rb} = ${fmt(b/s.rb)}`);text(d,tr('why'));text(d,`${tr('max')}: ${n} ${tr(s.p)}`,'p','number');text(d,`${tr('limit')}: ${lim==='equal'?tr('equal'):tr(lim)}`);text(d,`${tr('left')}: ${la} ${tr(s.a)}, ${lb} ${tr(s.b)}`);drawTokens(d,n,s.ep);add(root,d);btn(root,tr('next'),()=>{st.section=1;rerender()},'primary')}text(root,tr('switchScene'),'p','muted')}
function limitChem(){const [h,o]=st.chem;const lh=h/2,lo=o;return Math.abs(lh-lo)<1e-10?'both':lh<lo?'h':'o'}
function renderChem(root){text(root,tr('chemIntro'),'h2');text(root,tr('chemText'));math(root,String.raw`2\mathrm{H_2}+\mathrm{O_2}\rightarrow2\mathrm{H_2O}`);text(root,tr('chemStep'),'div','summary');const grid=html('div','grid');control(grid,tr('hyd'),st.chem[0],n=>{st.chem[0]=n;st.chemChecked=false;st.chemShow=false;st.chemSelect='';rerender()});control(grid,tr('oxy'),st.chem[1],n=>{st.chem[1]=n;st.chemChecked=false;st.chemShow=false;st.chemSelect='';rerender()});add(root,grid);text(root,tr('chemPredict'),'h3');const opts=html('div','answers');[['h','qReactA'],['o','qReactB'],['both','both']].forEach(([v,l])=>btn(opts,tr(l),()=>{st.chemSelect=v;st.chemChecked=false;rerender()},st.chemSelect===v?'active':''));add(root,opts);const acts=html('div','actions');btn(acts,tr('check'),()=>{st.chemChecked=true;progress();rerender()},'primary',!st.chemSelect);btn(acts,tr('hint'),()=>{st.chemHint=Math.min(3,st.chemHint+1);rerender()});btn(acts,tr('explain'),()=>{st.chemShow=!st.chemShow;rerender()});add(root,acts);if(st.chemHint){const hints=st.lang==='he'?['כיצד המקדמים מגדירים יחס בין מולים?','כמה פעמים אפשר לבצע את התגובה לפי המימן בלבד ולפי החמצן בלבד?','השוו n(H₂)/2 עם n(O₂)/1.']:['كيف تحدد المعاملات النسبة المولية؟','كم مرة يمكن تنفيذ التفاعل اعتمادًا على الهيدروجين وحده، ثم الأكسجين وحده؟','قارنوا n(H₂)/2 و n(O₂)/1.'];text(root,hints[st.chemHint-1],'div','hint')}if(st.chemChecked)text(root,st.chemSelect===limitChem()?tr('correct'):tr('retry'),'p',st.chemSelect===limitChem()?'correct':'wrong');if(st.chemShow){const [h,o]=st.chem,extent=Math.min(h/2,o),prod=extent*2,lh=h-extent*2,lo=o-extent;const p=html('section','panel');text(p,tr('chemCompare'));math(p,String.raw`\min\left(\frac{${h}}{2},\frac{${o}}{1}\right)=${fmt(extent)}`,'equationbox');text(p,`${tr('chemOutput')}: ${fmt(prod)} ${tr('water')}`,'p','number');text(p,`${tr('chemExcess')}: ${fmt(lh)} ${tr('hyd')}; ${fmt(lo)} ${tr('oxy')}`);add(root,p)}if(st.chemChecked&&st.chemSelect===limitChem())btn(root,tr('move'),()=>{st.section=2;rerender()},'primary')}
function renderQuiz(root){text(root,tr('slideTitle'),'h2');text(root,tr('slideIntro'));math(root,String.raw`3\mathrm{NO_2}(g)+\mathrm{H_2O}(l)\rightarrow2\mathrm{HNO_3}(l)+\mathrm{NO}(g)`);if(st.quizIndex>=5){text(root,tr('done'),'div','correct');text(root,tr('conclude'),'h3');text(root,tr('final'));math(root,String.raw`n(\mathrm{HNO_3})=\frac{10}{3}\ \mathrm{mol}\quad;\quad n_{\mathrm{remaining}}(\mathrm{H_2O})=\frac{1}{3}\ \mathrm{mol}`);btn(root,tr('restartLesson'),()=>{st.quizIndex=0;st.quizSelect=-1;st.quizChecked=false;st.quizHint=0;st.quizY=['',''];rerender()});return}const i=st.quizIndex; text(root,`${tr('step')} ${i+1} ${tr('of')} 5`,'span','tag');text(root,tr('slideQuestion')[i],'h3');
if(i===1){
 text(root,tr('yIntro'),'p','summary');
 const yGrid=html('div','grid');
 [[0,'yNO2'],[1,'yH2O']].forEach(([j,key])=>{const field=html('div','panel');const lab=html('label','muted',tr(key));const id='y-input-'+j;lab.htmlFor=id;add(field,lab);const input=html('input');input.id=id;input.type='number';input.step='any';input.min='0';input.inputMode='decimal';input.value=st.quizY[j];input.setAttribute('aria-label',tr(key));input.oninput=()=>{st.quizY[j]=input.value;st.quizChecked=false;save()};add(field,input);add(yGrid,field)});add(root,yGrid);
 const yBar=html('div','actions');btn(yBar,tr('check'),()=>{st.quizChecked=true;rerender()},'primary');btn(yBar,tr('hint'),()=>{st.quizHint=Math.min(3,st.quizHint+1);rerender()});add(root,yBar);
 if(st.quizHint)text(root,st.quizHint===1?tr('yHint'):tr('slideHints')[1][Math.min(st.quizHint-1,2)],'div','hint');
 if(st.quizChecked){const a=Number(st.quizY[0]),b=Number(st.quizY[1]);const filled=st.quizY.every(v=>v.trim()!==''&&Number.isFinite(Number(v)));const ok=filled&&Math.abs(a-5/3)<0.02&&Math.abs(b-2)<0.02; text(root,!filled?tr('yNeeded'):ok?tr('yCorrect'):tr('yError'),'div',ok?'correct':'wrong');if(ok)btn(root,tr('advance'),()=>{st.quizIndex++;st.quizSelect=-1;st.quizChecked=false;st.quizHint=0;progress();rerender()},'primary')}
 return;
}
if(i===2){text(root,tr('yCompare'),'p','summary');const panel=html('div','panel');math(panel,String.raw`Y(\mathrm{NO_2})=\frac{5}{3}\approx1.67\qquad Y(\mathrm{H_2O})=\frac{2}{1}=2`,'equationbox');add(root,panel)}
const choices=html('div','answers');tr('slideChoices')[i].forEach((c,j)=>btn(choices,c,()=>{st.quizSelect=j;st.quizChecked=false;rerender()},st.quizSelect===j?'active':''));add(root,choices);const bar=html('div','actions');btn(bar,tr('check'),()=>{st.quizChecked=true;rerender()},'primary',st.quizSelect<0);btn(bar,tr('hint'),()=>{st.quizHint=Math.min(3,st.quizHint+1);rerender()});add(root,bar);if(st.quizHint)text(root,tr('slideHints')[i][st.quizHint-1],'div','hint');if(st.quizChecked){const ok=st.quizSelect===0;text(root,ok?tr('right'):tr('wrong'),'div',ok?'correct':'wrong');if(ok)btn(root,tr('advance'),()=>{st.quizIndex++;st.quizSelect=-1;st.quizChecked=false;st.quizHint=0;progress();rerender()},'primary')}
}
// SCORM 1.2 adapter; supports standalone browser operation without LMS.
const SCORM={api:null,init(){let w=window;for(let i=0;i<8&&w;i++){try{if(w.API){this.api=w.API;break}if(w.parent===w)break;w=w.parent}catch(e){break}}if(!this.api&&window.opener){try{w=window.opener;for(let i=0;i<8&&w;i++){if(w.API){this.api=w.API;break}if(w.parent===w)break;w=w.parent}}catch(e){}}if(this.api){try{this.api.LMSInitialize('');const saved=this.get('cmi.suspend_data');if(saved){const obj=JSON.parse(saved);if(obj&&Array.isArray(obj.completed)&&obj.completed.length===3)st=Object.assign(defaults(),obj)}}catch(e){}}},get(k){return this.api?this.api.LMSGetValue(k):''},set(k,v){if(this.api)this.api.LMSSetValue(k,v)},commit(){if(this.api)this.api.LMSCommit('')},finish(){if(this.api){this.commit();this.api.LMSFinish('')}}};window.SCORM=SCORM;SCORM.init();if(!SCORM.api){try{const saved=localStorage.getItem('oranim_s4_v1');if(saved){const obj=JSON.parse(saved);if(obj&&Array.isArray(obj.completed)&&obj.completed.length===3)st=Object.assign(defaults(),obj)}}catch(e){}}window.addEventListener('pagehide',()=>SCORM.finish());render();
